<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundMind — Panel de Administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: linear-gradient(135deg, #05050c, #0f0f23); color: #f0f0fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: rgba(11,11,22,0.9); border: 1px solid rgba(167,139,250,.2); border-radius: 24px; padding: 32px; width: 100%; max-width: 480px; backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(124,58,237,.2); }
    h2 { font-family: 'Syne', sans-serif; font-size: 24px; margin-bottom: 8px; }
    p.sub { color: #9090b0; font-size: 14px; margin-bottom: 24px; }
    .hidden { display: none !important; }
    input, select { width: 100%; padding: 12px 16px; border-radius: 50px; border: 1px solid rgba(255,255,255,.06); background: #111120; color: #f0f0fa; font-size: 15px; margin-bottom: 12px; outline: none; font-family: 'DM Sans', sans-serif; }
    input:focus, select:focus { border-color: #a78bfa; }
    .btn { width: 100%; padding: 14px; border-radius: 50px; background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #fff; font-weight: 700; font-size: 15px; border: none; cursor: pointer; transition: .2s; box-shadow: 0 8px 28px rgba(124,58,237,.38); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(124,58,237,.48); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .msg { text-align: center; margin-top: 10px; font-size: 14px; color: #f87171; }
    label { display: block; font-size: 13px; color: #9090b0; margin-bottom: 4px; font-weight: 600; }
  </style>
</head>
<body>

<div class="container" id="loginBox">
  <h2>🔐 Administración</h2>
  <p class="sub">Ingresa la contraseña para continuar</p>
  <input type="password" id="adminPass" placeholder="Contraseña">
  <button class="btn" id="loginBtn">Acceder</button>
  <div id="loginMsg" class="msg"></div>
</div>

<div class="container hidden" id="uploadBox">
  <h2>🎵 Subir nueva canción</h2>
  <p class="sub">Completa los campos y selecciona los archivos</p>
  <form id="uploadForm">
    <label>Título</label>
    <input type="text" id="titulo" placeholder="Nombre de la canción" required>

    <label>Artista</label>
    <input type="text" id="artista" placeholder="Nombre del artista" required>

    <label>Género</label>
    <select id="genero" required>
      <option value="">Selecciona un género</option>
      <option>Pop</option><option>Electrónica</option><option>Rock</option><option>Anime</option>
      <option>Latino</option><option>Alternativo</option><option>Trap</option><option>Balada</option>
      <option>J-Pop</option><option>Phonk</option><option>Otro</option>
    </select>

    <label>Archivo de audio (MP3)</label>
    <input type="file" id="audioFile" accept="audio/mpeg" required>

    <label>Imagen de portada (JPG/PNG)</label>
    <input type="file" id="imageFile" accept="image/*" required>

    <button type="submit" class="btn" id="submitBtn">Subir canción</button>
    <div id="uploadMsg" class="msg"></div>
  </form>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!window.supabase) {
      document.getElementById('loginMsg').textContent = 'Error: No se pudo cargar Supabase.';
      return;
    }

    const SUPABASE_URL = 'https://jhlktvdylbiieeuwykgj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpobGt0dmR5bGJpaWVldXd5a2dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzIwNjMsImV4cCI6MjA5NTkwODA2M30.jie5MZF36VXhsfEZggCCWJ3M5HQVShGmyss6f-nLa3s';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const ADMIN_PASSWORD = 'soundmind2025';

    const loginBox = document.getElementById('loginBox');
    const uploadBox = document.getElementById('uploadBox');
    const loginBtn = document.getElementById('loginBtn');
    const loginMsg = document.getElementById('loginMsg');
    const adminPass = document.getElementById('adminPass');

    loginBtn.addEventListener('click', () => {
      if (adminPass.value === ADMIN_PASSWORD) {
        loginBox.classList.add('hidden');
        uploadBox.classList.remove('hidden');
        loginMsg.textContent = '';
      } else {
        loginMsg.textContent = 'Contraseña incorrecta';
      }
    });

    adminPass.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const uploadMsg = document.getElementById('uploadMsg');
      submitBtn.disabled = true;
      uploadMsg.textContent = 'Subiendo archivos…';

      const audioFile = document.getElementById('audioFile').files[0];
      const imageFile = document.getElementById('imageFile').files[0];
      const titulo = document.getElementById('titulo').value.trim();
      const artista = document.getElementById('artista').value.trim();
      const genero = document.getElementById('genero').value;

      if (!audioFile || !imageFile || !titulo || !artista || !genero) {
        uploadMsg.textContent = 'Completa todos los campos y selecciona ambos archivos.';
        submitBtn.disabled = false;
        return;
      }

      try {
        // Función para limpiar nombres de archivo
        const cleanName = (name) => name.replace(/[^a-zA-Z0-9._-]/g, '_');

        // Subir audio
        const audioPath = `audios/${Date.now()}_${cleanName(audioFile.name)}`;
        const { error: audioError } = await supabase.storage
          .from('musica')
          .upload(audioPath, audioFile, { contentType: 'audio/mpeg' });
        if (audioError) throw new Error('Error al subir audio: ' + audioError.message);

        // Subir imagen
        const imagePath = `imagenes/${Date.now()}_${cleanName(imageFile.name)}`;
        const { error: imageError } = await supabase.storage
          .from('musica')
          .upload(imagePath, imageFile, { contentType: imageFile.type });
        if (imageError) throw new Error('Error al subir imagen: ' + imageError.message);

        const audioUrl = supabase.storage.from('musica').getPublicUrl(audioPath).data.publicUrl;
        const imageUrl = supabase.storage.from('musica').getPublicUrl(imagePath).data.publicUrl;

        // Insertar en la tabla (solo las columnas que existen)
        const { error: insertError } = await supabase
          .from('canciones')
          .insert({ titulo, artista, genero, url_preview: audioUrl, url_imagen: imageUrl });
        if (insertError) throw new Error('Error al guardar canción: ' + insertError.message);

        uploadMsg.textContent = '✅ Canción subida con éxito!';
        document.getElementById('uploadForm').reset();
      } catch (err) {
        console.error(err);
        uploadMsg.textContent = '❌ ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  });
</script>
</body>
</html>
